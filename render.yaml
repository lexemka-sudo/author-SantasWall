services:
  - type: web
    name: s-wall-author-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_PATH
        value: /var/data/swall.sqlite3
    disk:
      name: swall-data
      mountPath: /var/data
      sizeGB: 1
