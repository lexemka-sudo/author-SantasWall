<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171416"><title>S. 壁 — Author Platform</title><style>
:root{--bg:#f3f0eb;--paper:#fffdfa;--ink:#252124;--muted:#817a78;--line:#e5ded7;--wine:#702c3b;--gold:#b89a6a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1180px)/2),22px);background:#171416;color:#f6f0eb;position:sticky;top:0;z-index:5}.logo{font:italic 32px Georgia;letter-spacing:-2px}.logo small{font:16px Georgia;letter-spacing:0}.top button{background:transparent;border:1px solid #5d5357;color:#f6f0eb;border-radius:30px;padding:9px 15px}.wrap{max-width:1180px;margin:auto;padding:28px 22px 80px}.nav{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}.nav button,.secondary{border:1px solid var(--line);background:var(--paper);border-radius:30px;padding:9px 15px;color:var(--muted)}.nav button.active,.primary{background:var(--wine);color:white;border-color:var(--wine)}.hero{min-height:310px;border-radius:20px;background:linear-gradient(90deg,#181417f5,#261d20c9 52%,#34272a77),radial-gradient(circle at 82% 32%,#ad8c80,#2c2226 65%);color:#fff;padding:42px;display:flex;align-items:center;position:relative;overflow:hidden}.hero:after{content:"S. 壁";position:absolute;right:4%;font:italic clamp(70px,15vw,170px) Georgia;color:#fff1}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}.hero h1{font:normal clamp(42px,6vw,68px)/1.02 Georgia;margin:13px 0}.hero p{color:#ddd0cd;max-width:440px}.primary,.secondary{border:1px solid var(--wine);border-radius:30px;padding:11px 18px}.secondary{background:transparent;color:var(--wine)}h1,h2,h3{font-family:Georgia;font-weight:400}h2{font-size:30px;margin:32px 0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}.cover{aspect-ratio:3/4;background:linear-gradient(145deg,#a58c84,#35282d 65%,#171416);color:#fff;display:flex;align-items:end;padding:17px;position:relative}.cover:after{content:"";position:absolute;inset:12px;border:1px solid #ffffff55}.cover b{font:italic 27px Georgia;z-index:1}.info{padding:13px}.info strong{font:19px Georgia}.muted{color:var(--muted);font-size:12px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;margin:14px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#faf8f5;padding:12px;color:var(--ink)}textarea{min-height:130px}.hidden{display:none!important}.auth{max-width:440px;margin:30px auto}.auth h1{font-size:44px}.workrow{display:flex;gap:12px;align-items:center;padding:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}.mini{width:62px;height:78px;background:#514147;color:#fff;display:grid;place-items:center;font:italic 23px Georgia;border-radius:7px}.tag{font-size:10px;color:var(--wine);letter-spacing:1px}.reader{max-width:760px;margin:25px auto;font:20px/1.9 Georgia;white-space:pre-wrap}.chapter{padding:14px 0;border-bottom:1px solid var(--line)}.notice{color:var(--muted);font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#211b1e;color:white;padding:12px 18px;border-radius:30px;z-index:10}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.top{padding:0 15px}.wrap{padding:18px 14px 70px}.hero{padding:27px;min-height:260px}.hero:after{right:-5%;font-size:80px}}
#splash{position:fixed;inset:0;background:#171416;color:#f7f0e9;z-index:30;display:grid;place-items:center;transition:opacity .65s ease,visibility .65s ease}#splash.out{opacity:0;visibility:hidden}.splash-inner{text-align:center}.splash-mark{font:italic 76px Georgia;letter-spacing:-7px}.splash-sub{font-size:9px;letter-spacing:5px;color:#b89a6a;margin-top:12px}.splash-line{height:2px;width:120px;background:#49383d;margin:28px auto 0;overflow:hidden}.splash-line:after{content:"";display:block;height:100%;width:40%;background:#b89a6a;animation:loadline 1s ease-in-out infinite}@keyframes loadline{from{transform:translateX(-110%)}to{transform:translateX(260%)}}</style></head><body><div id="splash"><div class="splash-inner"><div class="splash-mark">S. 壁</div><div class="splash-sub">AUTHOR PLATFORM</div><div class="splash-line"></div></div></div><header class="top"><div class="logo">S.<small>壁</small></div><button id="account">Войти</button></header><main class="wrap"><nav class="nav" id="nav"></nav><div id="app"></div></main><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s);let me=null,works=[],tab="home",current=null;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(url,opts={}){let r=await fetch(url,{credentials:"same-origin",...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Ошибка");return d}function toast(s){let e=$("#toast");e.textContent=s;e.classList.remove("hidden");setTimeout(()=>e.classList.add("hidden"),2400)}function owner(){return me?.role==="owner"}
async function refresh(){me=(await api("/api/me")).user;works=(await api("/api/works")).works;$("#account").textContent=me?"Выйти":"Войти";render()}
function nav(){let a=[["home","Главная"],["catalog","Каталог"],["library","Библиотека"]];if(owner())a.push(["studio","Панель автора"]);$("#nav").innerHTML=a.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?"active":""}">${v}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()})}
function cards(a){return a.map(w=>`<article class="card" data-work="${w.id}"><div class="cover"><b>${esc(w.title)}</b></div><div class="info"><strong>${esc(w.title)}</strong><div class="muted">${esc(w.kind)} · ${esc(w.genre)}</div><div class="muted">${w.chapter_count} глав</div></div></article>`).join("")}
function home(){return `<section class="hero"><div style="position:relative;z-index:1"><div class="eyebrow">WRITE · READ · INSPIRE</div><h1>Истории,<br>которые остаются.</h1><p>Авторская платформа S. 壁 — место для миров, созданных словами.</p><button class="primary" onclick="tab='catalog';render()">Открыть каталог →</button></div></section><h2>Истории S. 壁</h2><div class="grid">${cards(works)}</div>`}
function catalog(){return `<div class="row between"><div><div class="eyebrow">DISCOVER STORIES</div><h1>Каталог</h1></div><input id="search" placeholder="Поиск…" style="max-width:260px;padding:12px;border:1px solid var(--line);border-radius:30px"></div><div class="grid" id="cards">${cards(works)}</div>`}
function library(){return `<div class="eyebrow">YOUR READING SPACE</div><h1>Библиотека</h1><p class="muted">Твоя коллекция историй S. 壁.</p><div class="grid">${cards(works)}</div>`}
function studio(){if(!owner())return "<div class=panel>Доступ только владельцу.</div>";return `<div class="eyebrow">OWNER ACCESS</div><h1>Панель автора</h1><p class="muted">Только владелец может создавать, изменять и удалять публикации.</p><div class="panel"><h2 style="margin-top:0">Новое произведение</h2><form id="newWork"><div class="field"><label>Название</label><input name="title" required></div><div class="field"><label>Формат</label><select name="kind"><option>Новелла</option><option>Манхва</option></select></div><div class="field"><label>Жанр</label><input name="genre"></div><div class="field"><label>Описание</label><textarea name="description"></textarea></div><button class="primary">Опубликовать</button></form></div><h2>Мои произведения</h2>${works.map(w=>`<div class="workrow"><div class="mini">S.</div><div style="flex:1;min-width:130px"><b>${esc(w.title)}</b><div class="muted">${esc(w.kind)} · ${w.chapter_count} глав</div></div><button class="secondary" data-edit="${w.id}">Изменить</button><button class="secondary" data-chapters="${w.id}">Главы</button><button class="secondary" data-delete="${w.id}">Удалить</button></div>`).join("")}`}
function auth(){return `<div class="auth"><div class="eyebrow">WELCOME TO S. 壁</div><h1 id="authTitle">Добро пожаловать</h1><p class="muted">Войди в свой аккаунт.</p><form id="authForm" class="panel"><div class="field"><label>Логин</label><input name="login" required autocomplete="username"></div><div class="field"><label>Пароль</label><input name="password" type="password" required minlength="8" autocomplete="current-password"></div><button class="primary" id="authSubmit">Войти</button></form><button class="secondary" id="switch">Создать читательский аккаунт</button><p class="notice">Пароли хранятся на сервере в виде криптографических хешей.</p></div>`}
async function detail(id){let d=await api("/api/works/"+id);current=d.work;$("#nav").classList.add("hidden");$("#app").innerHTML=`<button class="secondary" id="back">← Назад</button><div class="row" style="align-items:flex-start;margin:25px 0"><div class="mini" style="width:145px;height:190px">S.</div><div><div class="tag">${esc(current.kind)} · ${esc(current.genre)}</div><h1>${esc(current.title)}</h1><p>${esc(current.description)}</p><div class="muted">Автор · S. 壁</div></div></div><h2>Главы</h2>${d.chapters.length?d.chapters.map(c=>`<div class="chapter"><b>${esc(c.title)}</b><article class="reader">${esc(c.body)}</article>${owner()?`<button class="secondary" data-delchapter="${c.id}">Удалить главу</button>`:""}</div>`).join(""):"<p class=muted>Главы скоро появятся.</p>"}${owner()?`<div class="panel"><h3>Добавить главу</h3><form id="chapterForm"><div class="field"><label>Название</label><input name="title" required></div><div class="field"><label>Текст</label><textarea name="body" required></textarea></div><button class="primary">Сохранить главу</button></form></div>`:""}${me?`<form id="commentForm" class="panel"><textarea name="body" placeholder="Комментарий…" required></textarea><button class="primary">Отправить</button></form>`:"" }${d.comments.map(c=>`<div class=panel><b>${esc(c.author)}</b><p>${esc(c.body)}</p></div>`).join("")}`;
$("#back").onclick=()=>{tab="catalog";$("#nav").classList.remove("hidden");render()};let f=$("#chapterForm");if(f)f.onsubmit=async e=>{e.preventDefault();await api(`/api/works/${id}/chapters`,{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(f)))});toast("Глава опубликована");detail(id)};let c=$("#commentForm");if(c)c.onsubmit=async e=>{e.preventDefault();await api(`/api/works/${id}/comments`,{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(c)))});toast("Комментарий добавлен");detail(id)};document.querySelectorAll("[data-delchapter]").forEach(b=>b.onclick=async()=>{await api("/api/chapters/"+b.dataset.delchapter,{method:"DELETE"});detail(id)})}
function bind(){document.querySelectorAll("[data-work]").forEach(b=>b.onclick=()=>detail(b.dataset.work));let s=$("#search");if(s)s.oninput=()=>{$("#cards").innerHTML=cards(works.filter(w=>(w.title+" "+w.genre).toLowerCase().includes(s.value.toLowerCase())));bind()};let f=$("#newWork");if(f)f.onsubmit=async e=>{e.preventDefault();try{await api("/api/works",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(f)))});works=(await api("/api/works")).works;render();toast("Опубликовано")}catch(x){toast(x.message)}};document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{if(confirm("Удалить произведение и все его главы?")){try{await api("/api/works/"+b.dataset.delete,{method:"DELETE"});works=(await api("/api/works")).works;render();toast("Удалено")}catch(e){toast(e.message)}}});document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=async()=>{let w=works.find(x=>x.id==b.dataset.edit),title=prompt("Название",w.title);if(title===null)return;let genre=prompt("Жанр",w.genre)||"",description=prompt("Описание",w.description)||"";try{await api("/api/works/"+w.id,{method:"PUT",body:JSON.stringify({...w,title,genre,description})});works=(await api("/api/works")).works;render();toast("Сохранено")}catch(e){toast(e.message)}});document.querySelectorAll("[data-chapters]").forEach(b=>b.onclick=()=>detail(b.dataset.chapters))}
function render(){nav();$("#app").innerHTML=({home,catalog,library,studio}[tab]||home)();bind()}
function showAuth(){tab="auth";$("#nav").classList.add("hidden");$("#app").innerHTML=auth();let reg=false;$("#switch").onclick=()=>{reg=!reg;$("#authTitle").textContent=reg?"Создать аккаунт":"Добро пожаловать";$("#authSubmit").textContent=reg?"Зарегистрироваться":"Войти";$("#switch").textContent=reg?"Уже зарегистрированы? Войти":"Создать читательский аккаунт"};$("#authForm").onsubmit=async e=>{e.preventDefault();try{let d=await api(reg?"/api/register":"/api/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});me=d.user;$("#account").textContent="Выйти";tab=owner()?"studio":"home";works=(await api("/api/works")).works;render();toast("Вы вошли")}catch(x){toast(x.message)}}}
$("#account").onclick=async()=>{if(me){await api("/api/logout",{method:"POST"});me=null;tab="home";refresh();toast("Вы вышли")}else showAuth()};refresh().catch(e=>toast(e.message)).finally(()=>setTimeout(()=>$("#splash")?.classList.add("out"),650));
</script></body></html>
